name: OS Delivery Acceptance

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "scripts/os-delivery-acceptance.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/os-delivery-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "scripts/os-delivery-acceptance.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/os-delivery-acceptance.yml"

jobs:
  real-os-delivery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout Data
        uses: actions/checkout@v4
        with:
          path: data

      - name: Checkout current AI-Verse OS
        uses: actions/checkout@v4
        with:
          repository: aiverse-filmmakers/AI-Verse-OS
          ref: main
          path: os

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install Data dependencies
        working-directory: data
        run: npm install --ignore-scripts

      - name: Build Data
        working-directory: data
        run: npm run build

      - name: Exercise real OS -> registered Data engine -> canonical Data
        run: node data/scripts/os-delivery-acceptance.mjs --os-root os
